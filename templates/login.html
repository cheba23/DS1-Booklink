
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookLink - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="header">

        <div class="header-container">

            <a href="{{ url_for('home') }}" class="logo">
                BookLink
            </a>

        </div>

    </header>


    <main class="container">

        <section class="auth-container">

            <div class="auth-card">

                <div class="auth-header">

                    <h1>Entrar</h1>

                    <p>
                        Acesse o sistema BookLink
                    </p>

                </div>


                {% if erro %}
                    <div class="mensagem-erro">
                        {{ erro }}
                    </div>
                {% endif %}


                <form
                    action="{{ url_for('auth.login') }}"
                    method="POST"
                >

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            name="emailForm"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            name="senhaForm"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <div class="menu">

                        <button
                            type="submit"
                            class="botao botao-adicionar"
                        >
                            Entrar
                        </button>


                        <a
                            href="{{ url_for('home') }}"
                            class="botao botao-buscar"
                        >
                            Voltar
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 BookLink - Sistema de Administração de Livrarias
        </p>

    </footer>

</body>

</html>
